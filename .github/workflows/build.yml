name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Debug Keystore
        run: |
          python3 -c 'import re, subprocess; txt = open("app/build.gradle.kts").read(); sp = (re.findall(r"storePassword\s*=\s*[\"\x27]([^\"\x27]+)", txt) or ["android"])[0]; ka = (re.findall(r"keyAlias\s*=\s*[\"\x27]([^\"\x27]+)", txt) or ["androiddebugkey"])[0]; kp = (re.findall(r"keyPassword\s*=\s*[\"\x27]([^\"\x27]+)", txt) or ["android"])[0]; subprocess.run(["keytool", "-genkey", "-v", "-keystore", "debug.keystore", "-storepass", sp, "-alias", ka, "-keypass", kp, "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000", "-dname", "CN=Android Debug,O=Android,C=US"], check=True)'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teach-me-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
